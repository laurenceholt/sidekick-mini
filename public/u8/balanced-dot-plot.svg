<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 70" width="110" height="70">
  <!-- Number line -->
  <line x1="10" y1="58" x2="100" y2="58" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Tick marks -->
  <g stroke="#1a1a2e" stroke-width="1.5">
    <line x1="18" y1="56" x2="18" y2="62"/>
    <line x1="34" y1="56" x2="34" y2="62"/>
    <line x1="50" y1="56" x2="50" y2="62"/>
    <line x1="66" y1="56" x2="66" y2="62"/>
    <line x1="82" y1="56" x2="82" y2="62"/>
  </g>
  <!-- Dots: balanced around center (50) -->
  <g fill="#455A64">
    <!-- column 1 at x=18 (1 dot) -->
    <circle cx="18" cy="50" r="3.5"/>
    <!-- column 2 at x=34 (2 dots) -->
    <circle cx="34" cy="50" r="3.5"/>
    <circle cx="34" cy="42" r="3.5"/>
    <!-- column 3 at x=50 (3 dots) -->
    <circle cx="50" cy="50" r="3.5"/>
    <circle cx="50" cy="42" r="3.5"/>
    <circle cx="50" cy="34" r="3.5"/>
    <!-- column 4 at x=66 (2 dots) -->
    <circle cx="66" cy="50" r="3.5"/>
    <circle cx="66" cy="42" r="3.5"/>
    <!-- column 5 at x=82 (1 dot) -->
    <circle cx="82" cy="50" r="3.5"/>
  </g>
  <!-- Optional middle indicator -->
  <line x1="50" y1="22" x2="50" y2="68" stroke="#F57F17" stroke-width="1" stroke-dasharray="2 2"/>
</svg>
