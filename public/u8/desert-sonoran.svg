<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 90" width="140" height="90">
  <!--
    Sonoran-desert scene: warm dusk sky, a stepped mesa (plateau) in the
    middle distance, three saguaro cacti in the foreground (different
    heights / arm configurations), a barrel cactus, and a few small rocks.
    Different palette from the generic desert.svg (which is sandy beige).
  -->
  <defs>
    <linearGradient id="sonoranSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD180"/>
      <stop offset="55%" stop-color="#FFAB91"/>
      <stop offset="100%" stop-color="#F4A582"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="140" height="60" fill="url(#sonoranSky)"/>
  <!-- Sun low on horizon -->
  <circle cx="112" cy="44" r="11" fill="#FFEE58" opacity="0.9"/>
  <circle cx="112" cy="44" r="14" fill="#FFEE58" opacity="0.35"/>

  <!-- Distant mesa (stepped plateau) -->
  <path d="M0,55 L0,46 L18,46 L22,42 L40,42 L40,55 Z" fill="#8D6E63" opacity="0.8"/>
  <path d="M50,55 L50,40 L60,40 L62,36 L80,36 L82,40 L88,40 L88,55 Z" fill="#A1887F" opacity="0.9"/>

  <!-- Ground (warm reddish sand) -->
  <path d="M0,60 Q35,55 70,60 Q105,55 140,60 L140,90 L0,90 Z" fill="#E07856"/>
  <path d="M0,70 Q40,66 80,70 Q110,68 140,70 L140,90 L0,90 Z" fill="#D45A38"/>

  <!-- Tall saguaro (left) -->
  <g stroke="#1B5E20" stroke-width="1.6" fill="#388E3C">
    <!-- Body -->
    <rect x="22" y="38" width="8" height="42" rx="2"/>
    <!-- Right arm -->
    <path d="M30,52 L38,52 L38,42 L34,42 L34,48 L30,48 Z"/>
    <!-- Left arm -->
    <path d="M22,58 L14,58 L14,46 L18,46 L18,54 L22,54 Z"/>
    <!-- Tip rounded -->
    <ellipse cx="26" cy="38" rx="4" ry="3"/>
  </g>
  <!-- Vertical ribs on tall saguaro -->
  <g stroke="#1B5E20" stroke-width="0.5" opacity="0.7">
    <line x1="24" y1="42" x2="24" y2="78"/>
    <line x1="28" y1="42" x2="28" y2="78"/>
  </g>

  <!-- Medium saguaro (center) -->
  <g stroke="#1B5E20" stroke-width="1.6" fill="#43A047">
    <rect x="64" y="50" width="8" height="30" rx="2"/>
    <path d="M72,60 L78,60 L78,52 L74,52 L74,56 L72,56 Z"/>
    <ellipse cx="68" cy="50" rx="4" ry="3"/>
  </g>

  <!-- Short cactus (right - barrel) -->
  <g stroke="#1B5E20" stroke-width="1.4" fill="#558B2F">
    <ellipse cx="96" cy="74" rx="7" ry="9"/>
  </g>
  <!-- Ribs on barrel -->
  <g stroke="#1B5E20" stroke-width="0.5" opacity="0.6" fill="none">
    <path d="M91,68 Q96,72 91,80"/>
    <path d="M96,66 Q96,72 96,82"/>
    <path d="M101,68 Q96,72 101,80"/>
  </g>

  <!-- Small saguaro (far right) -->
  <g stroke="#1B5E20" stroke-width="1.4" fill="#388E3C">
    <rect x="116" y="62" width="6" height="20" rx="2"/>
    <ellipse cx="119" cy="62" rx="3" ry="2.5"/>
  </g>

  <!-- Small rocks scattered -->
  <ellipse cx="48" cy="80" rx="4" ry="2" fill="#6D4C41"/>
  <ellipse cx="56" cy="84" rx="3" ry="1.6" fill="#5D4037"/>
  <ellipse cx="86" cy="84" rx="3.5" ry="1.8" fill="#6D4C41"/>

  <!-- Tiny tumble-grass -->
  <g stroke="#A1887F" stroke-width="0.7" fill="none">
    <path d="M40,84 L42,80 M42,84 L41,80 M44,84 L43,80"/>
  </g>
</svg>
