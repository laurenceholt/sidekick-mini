<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" width="110" height="80">
  <!-- Posts -->
  <rect x="5" y="60" width="4" height="20" fill="#37474F"/>
  <rect x="101" y="60" width="4" height="20" fill="#37474F"/>
  <!-- Sign body -->
  <rect x="2" y="10" width="106" height="56" rx="6" fill="#1a1a2e" stroke="#37474F" stroke-width="2"/>
  <!-- HOME label -->
  <text x="28" y="24" font-family="Nunito, sans-serif" font-size="9" font-weight="900" fill="#fff" text-anchor="middle">HOME</text>
  <!-- VISITOR label -->
  <text x="80" y="24" font-family="Nunito, sans-serif" font-size="9" font-weight="900" fill="#fff" text-anchor="middle">AWAY</text>
  <!-- Score displays -->
  <rect x="12" y="28" width="32" height="32" rx="3" fill="#D84315"/>
  <text x="28" y="53" font-family="Nunito, sans-serif" font-size="22" font-weight="900" fill="#FFEE58" text-anchor="middle">3</text>
  <rect x="64" y="28" width="32" height="32" rx="3" fill="#D84315"/>
  <text x="80" y="53" font-family="Nunito, sans-serif" font-size="22" font-weight="900" fill="#FFEE58" text-anchor="middle">7</text>
  <!-- Colon between -->
  <circle cx="55" cy="38" r="1.5" fill="#FFEE58"/>
  <circle cx="55" cy="50" r="1.5" fill="#FFEE58"/>
</svg>
