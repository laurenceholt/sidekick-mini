<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Ball -->
  <circle cx="40" cy="40" r="34" fill="#fff" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Center pentagon -->
  <polygon points="40,30 50,37 46,48 34,48 30,37" fill="#1a1a2e"/>
  <!-- Surrounding hexagons (suggested via lines) -->
  <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
    <path d="M40,30 L40,12"/>
    <path d="M50,37 L66,30"/>
    <path d="M46,48 L56,62"/>
    <path d="M34,48 L24,62"/>
    <path d="M30,37 L14,30"/>
  </g>
  <!-- Small dark hexagon shapes at the edges -->
  <g fill="#1a1a2e">
    <polygon points="40,12 50,8 48,2 32,2 30,8" opacity="0.7"/>
    <polygon points="66,30 74,28 74,18 70,16 66,22" opacity="0.7"/>
    <polygon points="56,62 60,72 50,76 46,68 50,64" opacity="0.7"/>
    <polygon points="24,62 30,64 34,68 30,76 20,72" opacity="0.7"/>
    <polygon points="14,30 10,22 6,16 6,28 14,30" opacity="0.7"/>
  </g>
</svg>
