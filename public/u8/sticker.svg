<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Kawaii sticker: round white sticker with a pink scalloped border, a
    smiling cat face in the middle, blush cheeks, a small cherry-blossom
    sparkle, and a Japanese-style hiragana-ish accent. Style cues are big
    eyes + tiny mouth + soft pink palette.
  -->
  <!-- Scalloped sticker outline -->
  <defs>
    <radialGradient id="stickerShade" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </radialGradient>
  </defs>
  <g>
    <!-- Build a scallop pattern by stacking small circles around the rim -->
    <g fill="#F8BBD0">
      <circle cx="50" cy="6"  r="6"/>
      <circle cx="65" cy="9"  r="6"/>
      <circle cx="78" cy="17" r="6"/>
      <circle cx="88" cy="30" r="6"/>
      <circle cx="92" cy="46" r="6"/>
      <circle cx="92" cy="62" r="6"/>
      <circle cx="86" cy="76" r="6"/>
      <circle cx="74" cy="86" r="6"/>
      <circle cx="58" cy="93" r="6"/>
      <circle cx="42" cy="93" r="6"/>
      <circle cx="26" cy="86" r="6"/>
      <circle cx="14" cy="76" r="6"/>
      <circle cx="8"  cy="62" r="6"/>
      <circle cx="8"  cy="46" r="6"/>
      <circle cx="12" cy="30" r="6"/>
      <circle cx="22" cy="17" r="6"/>
      <circle cx="35" cy="9"  r="6"/>
    </g>
    <!-- Inner round sticker face -->
    <circle cx="50" cy="50" r="38" fill="url(#stickerShade)" stroke="#EC407A" stroke-width="2"/>
  </g>

  <!-- Cat ears -->
  <g fill="#FFE0F0" stroke="#EC407A" stroke-width="1.8" stroke-linejoin="round">
    <path d="M30,30 L26,16 L40,24 Z"/>
    <path d="M70,30 L74,16 L60,24 Z"/>
  </g>
  <!-- Inner ears (pink) -->
  <path d="M32,28 L30,22 L36,25 Z" fill="#F48FB1"/>
  <path d="M68,28 L70,22 L64,25 Z" fill="#F48FB1"/>

  <!-- Cat head -->
  <circle cx="50" cy="50" r="22" fill="#fff" stroke="#EC407A" stroke-width="1.8"/>

  <!-- Eyes — big sparkly black ovals -->
  <ellipse cx="41" cy="49" rx="3.4" ry="5" fill="#1a1a2e"/>
  <ellipse cx="59" cy="49" rx="3.4" ry="5" fill="#1a1a2e"/>
  <!-- Eye sparkles -->
  <ellipse cx="42.2" cy="47" rx="1.2" ry="1.6" fill="#fff"/>
  <ellipse cx="60.2" cy="47" rx="1.2" ry="1.6" fill="#fff"/>
  <ellipse cx="39.7" cy="51.5" rx="0.7" ry="1" fill="#fff" opacity="0.85"/>
  <ellipse cx="57.7" cy="51.5" rx="0.7" ry="1" fill="#fff" opacity="0.85"/>

  <!-- Blush cheeks -->
  <ellipse cx="36" cy="57" rx="3.5" ry="2.4" fill="#FFB6C1" opacity="0.85"/>
  <ellipse cx="64" cy="57" rx="3.5" ry="2.4" fill="#FFB6C1" opacity="0.85"/>

  <!-- Tiny smile (cat 'w' mouth) -->
  <path d="M44,58 Q47,62 50,59 Q53,62 56,58" fill="none" stroke="#1a1a2e" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Nose dot -->
  <path d="M48.5,55.5 L50,57 L51.5,55.5 Z" fill="#EC407A"/>

  <!-- Whiskers -->
  <g stroke="#A1887F" stroke-width="0.9" stroke-linecap="round" fill="none">
    <line x1="27" y1="53" x2="35" y2="55"/>
    <line x1="27" y1="58" x2="35" y2="58"/>
    <line x1="65" y1="55" x2="73" y2="53"/>
    <line x1="65" y1="58" x2="73" y2="58"/>
  </g>

  <!-- Cherry-blossom sparkle (top-right) -->
  <g transform="translate(76,28)">
    <g fill="#F48FB1">
      <ellipse cx="0" cy="-5" rx="2.5" ry="3.5"/>
      <ellipse cx="4.8" cy="-1.5" rx="2.5" ry="3.5" transform="rotate(72 4.8 -1.5)"/>
      <ellipse cx="3" cy="4" rx="2.5" ry="3.5" transform="rotate(144 3 4)"/>
      <ellipse cx="-3" cy="4" rx="2.5" ry="3.5" transform="rotate(-144 -3 4)"/>
      <ellipse cx="-4.8" cy="-1.5" rx="2.5" ry="3.5" transform="rotate(-72 -4.8 -1.5)"/>
    </g>
    <circle cx="0" cy="0" r="1.2" fill="#FFEB3B"/>
  </g>
</svg>
