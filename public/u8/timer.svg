<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <!-- Button on top -->
  <rect x="44" y="2" width="12" height="6" rx="2" fill="#455A64"/>
  <rect x="40" y="6" width="20" height="6" rx="2" fill="#455A64"/>
  <!-- Body -->
  <circle cx="50" cy="62" r="40" fill="#fff" stroke="#1a1a2e" stroke-width="3"/>
  <circle cx="50" cy="62" r="36" fill="#FAFAFA"/>
  <!-- Tick marks -->
  <g stroke="#455A64" stroke-width="1.5">
    <line x1="50" y1="28" x2="50" y2="34"/>
    <line x1="50" y1="90" x2="50" y2="96"/>
    <line x1="16" y1="62" x2="22" y2="62"/>
    <line x1="78" y1="62" x2="84" y2="62"/>
  </g>
  <!-- "55" minutes label -->
  <text x="50" y="58" font-family="Nunito, sans-serif" font-size="14" font-weight="900" fill="#1a1a2e" text-anchor="middle">55</text>
  <text x="50" y="74" font-family="Nunito, sans-serif" font-size="8" font-weight="700" fill="#666" text-anchor="middle">min</text>
  <!-- Hands: pointing toward 55 minutes (just before 12 o'clock) -->
  <!-- Minute hand at 55 min = 330° (-30° from up) -->
  <line x1="50" y1="62" x2="50" y2="32" stroke="#D84315" stroke-width="3" stroke-linecap="round" transform="rotate(-30 50 62)"/>
  <!-- Hour hand short -->
  <line x1="50" y1="62" x2="58" y2="58" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <!-- Center pin -->
  <circle cx="50" cy="62" r="3" fill="#1a1a2e"/>
</svg>
